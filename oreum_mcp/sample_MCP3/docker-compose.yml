# 관광AX플랫폼의 "MCP 서버 등록" 화면에 서버 URL을 입력하면
# 플랫폼이 인터넷을 통해 그 URL로 직접 접속 — 그래서 mcp-server는
# host 포트를 직접 열지 않고, ngrok 서비스 하나로만 외부에 노출
#
# /map/{course_id} 지도 페이지도 mcp-server의 같은 포트에서 나가므로,
# ngrok 터널이 뜨면 자동으로 같은 도메인에서 열립니다.
#
#   docker compose up --build
#
services:
  mcp-server:
    build: .
    environment:
      JEJU_DSN: postgresql://jeju:${DB_PASSWORD:-jeju}@db:5432/jeju_courses
      KAKAO_REST_KEY: ${KAKAO_REST_KEY:-}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8000"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://mcp-server:8000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jeju-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 관광AX플랫폼 등록 화면이 이 URL로 인터넷을 통해 직접 접속해 tools/list를
  # 검증합니다. mcp-server는 host 포트를 열지 않고, 외부 노출은 이 ngrok
  # 터널 하나로만 나갑니다.
  ngrok:
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    # --url은 ngrok agent v3 문법입니다. 이미지가 v2 계열이면
    # --domain 또는 --hostname으로 바꿔야 합니다.
    #
    # NGROK_DOMAIN은 ngrok 대시보드에서 예약한 고정 도메인 사용
    command: ["http", "mcp-server:8000", "--url=${NGROK_DOMAIN}", "--log=stdout"]
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - jeju-net
    restart: unless-stopped
    ports:
      # 반드시 루프백(127.0.0.1)으로만 바인딩합니다. "4040:4040"으로 열면
      # 인증 없는 ngrok 인스펙터가 모든 요청/응답 내용을 외부에 노출합니다 —
      # 로컬에서 터널 상태를 확인할 때만 쓰는 용도라 외부 접근을 막습니다.
      - "127.0.0.1:4040:4040"

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jeju_courses
      POSTGRES_USER: jeju
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jeju}
    volumes:
      # 스키마와 코스/태그/시설 시드 데이터입니다. 볼륨이 비어 있는 최초
      # 기동 시에만 실행됩니다 — docker compose up 한 번으로 데이터까지
      # 채워진 상태로 뜹니다. 시드 재생성: python scripts/export_seed.py
      # > db/init/02_seed.sql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - jeju-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeju -d jeju_courses"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jeju-net
    restart: unless-stopped

networks:
  jeju-net:
    driver: bridge

volumes:
  jeju-db-data:
