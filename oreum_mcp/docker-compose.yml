services:
  oreum-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oreum-mcp
    ports:
      - "${OREUM_MCP_PORT:-11010}:${OREUM_MCP_PORT:-11010}"
    volumes:
      - ./modules:/app/modules
      - ./app.py:/app/app.py
      - ./static:/app/static   # 추천 결과 지도 보기 페이지 (읽기 전용, 좌표 저장 기능 없음)
      - ../data:/app/data:ro   # data/oreum.json 읽기 전용 마운트 (map_editor가 쓰는 파일 그대로)
    environment:
      - OREUM_MCP_PORT=${OREUM_MCP_PORT:-11010}
      - OREUM_DATA_PATH=/app/data/oreum.json
      # recommend_oreum이 반환하는 map_url에 쓰일, 이 서버가 외부에 노출된 실제
      # 주소. ngrok으로 노출한다면 발급된 고정 도메인으로 설정 (미설정 시
      # http://localhost:$OREUM_MCP_PORT로 대체되어 컨테이너 밖에서는 안 열림).
      - OREUM_MCP_PUBLIC_URL=${OREUM_MCP_PUBLIC_URL:-}
      # /view 지도 페이지(카카오맵)용 JS 키. 레포에 하드코딩하지 않고 .env에서 주입.
      - KAKAO_JS_KEY=${KAKAO_JS_KEY:-}
    command: sh -c "python app.py --host 0.0.0.0 --port $${OREUM_MCP_PORT}"
    restart: unless-stopped
    networks:
      - etri-jejuax-gateway-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${OREUM_MCP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 외부(ngrok)로 노출해 MCP 도구 등록 시 사용. 필요 없으면 이 서비스는 빼고
  # oreum-mcp-server만 내부망에서 써도 된다.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: oreum-mcp-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "oreum-mcp-server:${OREUM_MCP_PORT:-11010}"
      - "--log=stdout"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4041:4040"
    depends_on:
      - oreum-mcp-server
    networks:
      - etri-jejuax-gateway-network

networks:
  # gateway(Kong)가 미리 생성한 외부 네트워크 — sample_MCP/docker-compose.yml과
  # 동일한 패턴. external: true 없이 name:만 쓰면, 이 compose를 먼저 올릴 때
  # 같은 이름의 새 네트워크를 만들어버려 실제 gateway/hostllm 네트워크와
  # 분리될 위험이 있다.
  etri-jejuax-gateway-network:
    external: true
    name: etri-jejuax-gateway-network
